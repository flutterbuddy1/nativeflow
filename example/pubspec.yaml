name: nativeflow_example
description: "NativeFlow example: a driver app exercising every NativeFlow API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  nativeflow:
    path: ../
  # The app's own protocol libraries. NativeFlow never replaces them.
  web_socket_channel: ^3.0.3
  socket_io_client: ^3.1.6
  mqtt_client: ^10.11.11

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
