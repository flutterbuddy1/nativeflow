name: nativeflow
description: >-
  OS-compliant background runtime for long-running Flutter apps. Keep your own
  socket/MQTT/location libraries; get recovery, persistent events and
  notifications.
version: 0.1.1
repository: https://github.com/flutterbuddy1/nativeflow
issue_tracker: https://github.com/flutterbuddy1/nativeflow/issues
documentation: https://github.com/flutterbuddy1/nativeflow/tree/main/doc
topics:
  - background
  - foreground-service
  - notifications
  - live-activities
  - runtime

environment:
  sdk: ^3.13.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.nativeflow
        pluginClass: NativeFlowPlugin
      ios:
        pluginClass: NativeFlowPlugin
